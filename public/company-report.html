<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>รายงานวิเคราะห์ | HR-Interview</title>
  <link rel="stylesheet" href="/styles.css?v=5"/>
  <link rel="icon" type="image/png" href="/logo.png?v=2"/>
<script>
  window.TENANT_ID = (location.pathname.match(/^\/t\/([^/]+)/) || [])[1] || '';
  window.TBASE = window.TENANT_ID ? '/t/' + window.TENANT_ID : '';
  function shouldPrefix(href){ return href && href.startsWith('/') && !href.startsWith('/t/') && !href.startsWith('/super') && !href.startsWith('/styles') && !href.startsWith('/logo') && !href.startsWith('/i18n') && !href.startsWith('/favicon') && !href.startsWith('/md') && !href.startsWith('/app-shell'); }
  function rewriteLinks(root){ if(!window.TBASE||!root)return; if(root.nodeType===1&&root.tagName==='A'&&shouldPrefix(root.getAttribute('href')))root.setAttribute('href',window.TBASE+root.getAttribute('href')); if(typeof root.querySelectorAll==='function')root.querySelectorAll('a[href^="/"]').forEach(a=>{const h=a.getAttribute('href');if(shouldPrefix(h))a.setAttribute('href',window.TBASE+h);}); }
  window.rewriteLinks = rewriteLinks;
  document.addEventListener('DOMContentLoaded', () => {
    if (!window.TBASE) return;
    rewriteLinks(document);
    new MutationObserver(m => { for (const x of m) { rewriteLinks(x.target); for (const n of x.addedNodes) rewriteLinks(n); } }).observe(document.body, { childList: true, subtree: true });
    const logo = document.querySelector('.topbar .logo');
    if (logo && !document.getElementById('tenant-company-name')) {
      const span = document.createElement('span'); span.id = 'tenant-company-name';
      span.style.cssText = 'color:#0369a1; font-size:14px; font-weight:600; margin-left:12px; padding-left:12px; border-left:1px solid #cbd5e1;';
      logo.appendChild(span);
      fetch(window.TBASE + '/api/company').then(r => r.ok ? r.json() : null).then(c => { span.textContent = c && c.name ? c.name : ''; if (!c || !c.name) span.style.display = 'none'; }).catch(() => { span.style.display = 'none'; });
    }
  });
</script>
  <script src="/md.js"></script>
  <script src="/app-shell.js?v=7"></script>
  <style>
    .cr-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .cr-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .cr-picker { margin-bottom:16px; background:#f8fafc; }
    .cr-row { display:flex; gap:12px 16px; align-items:center; flex-wrap:wrap; }
    .cr-row label { margin:0; font-weight:600; color:#334155; display:flex; align-items:center; gap:8px; }
    .cr-row select { width:auto; min-width:180px; padding:8px 12px; }
    .cr-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .cr-chip { font-size:13px; padding:5px 12px; border-radius:999px; background:#eff6ff; color:#0369a1; border:1px solid #bae6fd; }
    .cr-chip.warn { background:#fffbeb; color:#b45309; border-color:#fde68a; }
    .cr-chip.ok { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
    .doc-card { background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .doc-card .doc-head { display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--border); background:#f8fafc; }
    .doc-card .doc-head h2 { margin:0; font-size:17px; border:0; padding:0; }
    .doc-card .doc-content { padding:22px 24px; }
    @media print {
      .app-sidebar, .app-topbar, .app-backdrop, .cr-actions, #cr-back, .cr-picker, .cr-meta { display:none !important; }
      .app-content, .container, .doc-card { all:unset; display:block; }
      .doc-card .doc-head { border:0; background:none; padding:0 0 8px; }
      .doc-card .doc-head span { display:none; }
    }
  </style>
</head>
<body>
<div class="container wide">
  <div class="topbar">
    <div class="logo"><span>HR-Interview</span></div>
    <nav>
      <a href="/dashboard">📋 Dashboard</a>
      <a href="#" onclick="(async()=>{await fetch(TBASE+'/api/logout',{method:'POST'});location.href=TBASE+'/login';})();return false;">ออกจากระบบ</a>
    </nav>
  </div>

  <div class="cr-head">
    <div>
      <h1 style="margin:0;">🧠 รายงานวิเคราะห์</h1>
      <p class="sub" style="margin:4px 0 0;">เลือกขอบเขต (บริษัท / ฝ่าย / แผนก / บุคคล) แล้วดูหรือส่งออกผลวิเคราะห์เป็น Text และ PDF</p>
    </div>
    <div class="cr-actions">
      <a id="cr-back" href="/dashboard"><button class="ghost">← กลับ Dashboard</button></a>
      <a id="cr-md" href="#"><button class="ghost">📝 ไฟล์ Text (.md)</button></a>
      <button id="cr-print" onclick="window.print()">🖨 ส่งออก PDF</button>
    </div>
  </div>

  <!-- ตัวเลือกขอบเขต -->
  <div class="card cr-picker">
    <div class="cr-row">
      <label>ระดับ:
        <select id="sel-level">
          <option value="company">บริษัท (ภาพรวม)</option>
          <option value="division">รายฝ่าย</option>
          <option value="section">รายแผนก</option>
          <option value="person">รายบุคคล</option>
        </select>
      </label>
      <label id="target-wrap" style="display:none;">เลือก:
        <select id="sel-target"></select>
      </label>
      <button id="btn-analyze" style="display:none;">🔄 วิเคราะห์กลุ่มนี้</button>
      <a id="link-review" style="display:none;" target="_blank"><button class="ghost">📄 ดูเอกสารทั้งหมดของคนนี้ →</button></a>
    </div>
    <p class="sub" id="picker-hint" style="margin:10px 0 0;"></p>
  </div>

  <div class="cr-meta" id="cr-meta"></div>

  <div class="doc-card">
    <div class="doc-head"><span style="font-size:18px;">📄</span><h2 id="report-title">Optimization Report</h2></div>
    <div class="doc-content md-body" id="cr-body"><p class="sub">กำลังโหลดรายงาน…</p></div>
  </div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
// เอกสารมีหัว H1 ของตัวเองอยู่แล้ว ซึ่งซ้ำกับหัวการ์ด — ตัดทิ้งก่อน render (กันหัวข้อโผล่ 2 ครั้ง)
const stripLeadingH1 = md => String(md || '').replace(/^﻿?\s*#\s+.*(?:\r?\n)+/, '');
const scopeBase = (level, id) => level + '-' + String(id || '').replace(/[^A-Za-z0-9_]/g, '');

const $ = id => document.getElementById(id);
const elLevel = $('sel-level'), elTarget = $('sel-target'), elTargetWrap = $('target-wrap');
const elAnalyze = $('btn-analyze'), elReviewLink = $('link-review'), elHint = $('picker-hint');
const elMeta = $('cr-meta'), elBody = $('cr-body'), elTitle = $('report-title'), elMd = $('cr-md');

let SCOPE = { divisions: [], sections: [], persons: [] };
let polling = null;

// โหลดรายการฝ่าย/แผนก/บุคคล ครั้งเดียว
async function loadScopeList() {
  try {
    const r = await fetch(TBASE + '/api/company/scope/list');
    if (r.ok) SCOPE = await r.json();
  } catch (_) {}
}

function targetOptions(level) {
  if (level === 'division') return SCOPE.divisions.map(d => ({ value: d.id, label: `${d.name} (สัมภาษณ์เสร็จ ${d.finished}/${d.total})`, finished: d.finished }));
  if (level === 'section')  return SCOPE.sections.map(s => ({ value: s.id, label: `${s.name} (สัมภาษณ์เสร็จ ${s.finished}/${s.total})`, finished: s.finished }));
  if (level === 'person')   return SCOPE.persons.map(p => ({ value: p.id, label: `${p.name}${p.role ? ' — ' + p.role : ''}`, finished: 1 }));
  return [];
}

function onLevelChange(keepTarget) {
  const level = elLevel.value;
  if (polling) { clearInterval(polling); polling = null; }
  if (level === 'company') {
    elTargetWrap.style.display = 'none';
    render();
    return;
  }
  const opts = targetOptions(level);
  elTargetWrap.style.display = '';
  const prev = keepTarget ? elTarget.value : '';
  elTarget.innerHTML = opts.length
    ? opts.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')
    : '<option value="">— ยังไม่มีข้อมูล —</option>';
  if (prev && opts.some(o => o.value === prev)) elTarget.value = prev;
  render();
}

// คำนวณ URL/ป้ายกำกับตามขอบเขตปัจจุบัน
function currentScope() {
  const level = elLevel.value;
  if (level === 'company') {
    return { level, title: 'รายงานภาพรวมบริษัท', mdUrl: TBASE + '/api/outputs/_company/optimization-report.md',
      statusUrl: TBASE + '/api/company/analyze/status', analyzeUrl: TBASE + '/api/company/analyze', analyzeBody: {},
      dl: 'รายงานภาพรวมบริษัท.md', canAnalyze: true };
  }
  const id = elTarget.value;
  if (level === 'person') {
    const p = SCOPE.persons.find(x => x.id === id);
    return { level, id, title: 'รายงานรายบุคคล: ' + (p ? p.name : ''), mdUrl: TBASE + '/api/outputs/' + encodeURIComponent(id) + '/optimization.md',
      statusUrl: null, analyzeUrl: null, dl: 'รายงาน-' + (p ? p.name : id) + '.md', canAnalyze: false, reviewId: id };
  }
  const list = level === 'division' ? SCOPE.divisions : SCOPE.sections;
  const g = list.find(x => x.id === id);
  const kind = level === 'division' ? 'ฝ่าย' : 'แผนก';
  const base = scopeBase(level, id);
  return { level, id, title: `รายงานวิเคราะห์${kind}: ${g ? g.name : ''}`,
    mdUrl: TBASE + '/api/outputs/_company/scope/' + base + '.md',
    statusUrl: TBASE + '/api/company/analyze/scope/status?level=' + level + '&id=' + encodeURIComponent(id),
    analyzeUrl: TBASE + '/api/company/analyze/scope', analyzeBody: { level, id },
    dl: `รายงาน${kind}-${g ? g.name : id}.md`, canAnalyze: true };
}

async function render() {
  const sc = currentScope();
  elTitle.textContent = sc.title;
  elMd.setAttribute('href', sc.mdUrl);
  elMd.setAttribute('download', sc.dl);
  elReviewLink.style.display = 'none';
  elAnalyze.style.display = 'none';
  elHint.textContent = '';

  // ปุ่มดูเอกสารทั้งหมด (เฉพาะรายบุคคล)
  if (sc.level === 'person' && sc.reviewId) {
    elReviewLink.style.display = '';
    elReviewLink.setAttribute('href', TBASE + '/review?id=' + encodeURIComponent(sc.reviewId));
  }
  // ปุ่มวิเคราะห์ (บริษัท/ฝ่าย/แผนก)
  if (sc.canAnalyze && (sc.level === 'company' || sc.id)) {
    elAnalyze.style.display = '';
    elAnalyze.textContent = '🔄 วิเคราะห์กลุ่มนี้';
    elAnalyze.disabled = false;
  }

  if ((sc.level === 'division' || sc.level === 'section') && !sc.id) {
    elBody.innerHTML = '<p class="empty">ยังไม่มีข้อมูลในระดับนี้</p>';
    elMeta.innerHTML = '';
    return;
  }

  // โหลดเนื้อหารายงาน
  elBody.innerHTML = '<p class="sub">กำลังโหลดรายงาน…</p>';
  try {
    const r = await fetch(sc.mdUrl);
    if (r.status === 403) { elBody.innerHTML = '<p class="empty">คุณไม่มีสิทธิ์ดูรายงานนี้ (เฉพาะแอดมิน/ผู้บริหาร)</p>'; }
    else if (!r.ok) {
      if (sc.level === 'person') elBody.innerHTML = '<p class="empty">คนนี้ยังไม่มีผลวิเคราะห์ — ให้เจ้าตัวหรือแอดมินกด “วิเคราะห์ใหม่” ในหน้าเอกสารของเขา (ปุ่มด้านบน)</p>';
      else elBody.innerHTML = '<p class="empty">ยังไม่มีรายงาน — กดปุ่ม “🔄 วิเคราะห์กลุ่มนี้” เพื่อสร้าง</p>';
    } else {
      const md = await r.text();
      elBody.innerHTML = window.renderMarkdown ? window.renderMarkdown(stripLeadingH1(md)) : `<pre style="white-space:pre-wrap;">${esc(md)}</pre>`;
    }
  } catch (e) { elBody.innerHTML = '<p class="empty" style="color:#b91c1c;">โหลดรายงานไม่สำเร็จ</p>'; }

  // แถบข้อมูลสรุป
  renderMeta(sc);
}

async function renderMeta(sc) {
  elMeta.innerHTML = '';
  if (!sc.statusUrl) { // รายบุคคล
    elMeta.innerHTML = '<span class="cr-chip">ระดับ: รายบุคคล</span>';
    return;
  }
  try {
    const s = await fetch(sc.statusUrl).then(r => r.json());
    const chips = [];
    if (s.reportCount != null) chips.push(`<span class="cr-chip">อิงสัมภาษณ์ ${s.reportCount} คน</span>`);
    if (s.finishedNow != null && s.reportCount == null) chips.push(`<span class="cr-chip">สัมภาษณ์เสร็จ ${s.finishedNow} คน</span>`);
    if (s.reportAt) chips.push(`<span class="cr-chip">สร้างเมื่อ ${fmtDate(s.reportAt)}</span>`);
    chips.push(`<span class="cr-chip">โหมด: ${s.claudeOn ? 'AI (Claude)' : 'เทมเพลต'}</span>`);
    if (s.newSince > 0) chips.push(`<span class="cr-chip warn">🔄 มีสัมภาษณ์ใหม่ ${s.newSince} คน — ควรวิเคราะห์ใหม่</span>`);
    elMeta.innerHTML = chips.join('');
  } catch (e) {}
}

// สั่งวิเคราะห์ + poll จนเสร็จ
async function doAnalyze() {
  const sc = currentScope();
  if (!sc.analyzeUrl) return;
  elAnalyze.disabled = true;
  elAnalyze.textContent = '⏳ กำลังวิเคราะห์…';
  elBody.innerHTML = '<p class="sub">🧠 AI กำลังวิเคราะห์ — อาจใช้เวลาสักครู่ กรุณาอย่าปิดหน้านี้…</p>';
  try {
    const r = await fetch(sc.analyzeUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sc.analyzeBody || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      elAnalyze.disabled = false; elAnalyze.textContent = '🔄 วิเคราะห์กลุ่มนี้';
      elBody.innerHTML = `<p class="empty" style="color:#b91c1c;">${esc(j.error || 'สั่งวิเคราะห์ไม่สำเร็จ')}</p>`;
      return;
    }
    // poll status
    if (polling) clearInterval(polling);
    polling = setInterval(async () => {
      try {
        const st = await fetch(sc.statusUrl).then(x => x.json());
        if (!st.running) {
          clearInterval(polling); polling = null;
          elAnalyze.disabled = false; elAnalyze.textContent = '🔄 วิเคราะห์ใหม่';
          if (st.error) { elBody.innerHTML = `<p class="empty" style="color:#b91c1c;">วิเคราะห์ไม่สำเร็จ: ${esc(st.error)}</p>`; return; }
          render(); // โหลดผลใหม่
        }
      } catch (_) {}
    }, 2500);
  } catch (e) {
    elAnalyze.disabled = false; elAnalyze.textContent = '🔄 วิเคราะห์กลุ่มนี้';
    elBody.innerHTML = '<p class="empty" style="color:#b91c1c;">เชื่อมต่อไม่สำเร็จ</p>';
  }
}

elLevel.addEventListener('change', () => onLevelChange(false));
elTarget.addEventListener('change', () => { if (polling) { clearInterval(polling); polling = null; } render(); });
elAnalyze.addEventListener('click', doAnalyze);

(async () => {
  await loadScopeList();
  // deep-link: ?level=division&id=... หรือ ?id=<empId> (รายบุคคลจาก dashboard)
  const qs = new URLSearchParams(location.search);
  const qlevel = qs.get('level'), qid = qs.get('id');
  if (qlevel && ['company','division','section','person'].includes(qlevel)) {
    elLevel.value = qlevel;
    onLevelChange(false);
    if (qid && elTargetWrap.style.display !== 'none') { elTarget.value = qid; render(); }
  } else if (qid) {
    elLevel.value = 'person'; onLevelChange(false); elTarget.value = qid; render();
  } else {
    onLevelChange(false);
  }
})();
</script>
</body>
</html>
